<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="style.css" />
    <title>repl.it</title>
  </head>
  <body>
    <div>
      <button id="btn1">Pobierz stacje</button>
    </div>
    <div>
      <button id="btn2">Pobierz lokalizacje</button>
    </div>
    <div>
      <button id="btn3">Pobierz dane</button>
    </div>
    <div>
      <input
        id="inp1"
        name="inp1"
        type="text"
        placeholder="Wpisz kod stanu..."
      />
      <button id="btn4">Pobierz stacje</button>
    </div>
    <div>
      <button id="btn5">Wykres zbiorów danych</button>
    </div>
    <div style="margin-top: 20px">
      <form id="form6">
        <select id="setid" name="setid" required>
          <option disabled selected value="">Wybierz zbiór danych...</option>
        </select>
        <input
          id="locationid"
          name="locationid"
          type="text"
          placeholder="Wpisz id lokalizacji..."
          required
        />
        <button type="button" id="randomLocation" aria-label="Losuj">🎲</button>

        <div style="display: flex; flex-direction: row; align-items: center">
          <label for="dates">Wybierz daty (możesz wybrać wiele):</label>
          <select id="dates" name="dates" multiple required>
            <option value="2020-01-03">2020-01-03</option>
            <option value="2020-01-01">2020-01-01</option>
            <option value="2020-01-02">2020-01-02</option>
          </select>
        </div>

        <input type="submit" value="Pobierz dane z wybranych dat" id="btn6" />
      </form>
    </div>
    <div id="answer"></div>
    <div style="width: 650px">
      <canvas id="decadeChart"></canvas>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
